
[Performance]
	#Maximum allowed radius for stress tests (in chunks)
	#Range: 1 ~ 64
	maxStressRadius = 15
	#Target TPS (usually 20.0)
	#Range: 1.0 ~ 20.0
	tpsTarget = 20.0
	#Low TPS threshold to reduce budget
	#Range: 1.0 ~ 20.0
	tpsLow = 18.0
	#Maximum worker threads for async chunk generation
	#Range: 1 ~ 64
	maxThreads = 22
	#Maximum deferred decoration tasks per tick
	#Range: 1 ~ 1024
	maxTasksPerTick = 64
	#Maximum queued chunk generation plans
	#Range: 64 ~ 8192
	maxQueuedPlans = 1024
	#Enable adaptive tick budget based on server TPS
	adaptiveBudget = true
	#Enable verbose diagnostics and debug logs
	diagnostics = false

[Budget]
	#Maximum budget units available per tick for feature placement
	#Range: 1 ~ 10000
	maxBudget = 100
	#Cost in budget units per new feature placement
	#Range: 1 ~ 1000
	newPlacementCost = 5
	#Cost in budget units per retry placement (0 = always allow)
	#Range: 0 ~ 1000
	retryPlacementCost = 1

